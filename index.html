<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <!-- These are overridden at runtime from src/data/portfolio.js (seo section) -->
    <title>abhisXsssss | Premium Video Editor &amp; Motion Designer</title>
    <meta
      name="description"
      content="Professional video editor and motion graphics designer specializing in cinematic edits, YouTube videos, and high-quality motion design."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="abhisXsssss | Premium Video Editor &amp; Motion Designer" />
    <meta
      property="og:description"
      content="Professional video editor and motion graphics designer specializing in cinematic edits, YouTube videos, and high-quality motion design."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Hidden static form for Netlify Forms detection.
      Netlify scans the built HTML at deploy time. React renders the real
      visible form, but this hidden copy tells Netlify the form exists and
      which fields it should expect. Do NOT remove this.
    -->
    <form
      name="hire-me"
      netlify
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="hire-me" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="projectType" />
      <input name="budget" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
